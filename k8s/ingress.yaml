apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: authsystem-ingress
  namespace: auth-system

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80